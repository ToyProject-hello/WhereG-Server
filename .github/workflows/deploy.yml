name: Backend Deploy

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew clean build -x test

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-jar
        path: build/libs/*.jar

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
   
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: backend-jar
        path: ~/app/backend/build/libs/

    
    - name: Deploy and Restart Server
      run: |
        cd ~/app/backend
        CURRENT_PID=$(pgrep -f 'whereG.*\.jar')
        if [ -z "$CURRENT_PID" ]; then
            echo "No running spring boot application found."
        else
            echo "Killing running application with PID: $CURRENT_PID"
            kill -15 $CURRENT_PID
            sleep 5
        fi
        
        nohup java -jar build/libs/*.jar > nohup.out 2>&1 &